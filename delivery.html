<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery · ORBIT</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.delivery-toolbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:1.25rem;flex-wrap:wrap;gap:10px;
}
.delivery-tabs{
  display:flex;gap:4px;background:var(--surface-alt);
  padding:6px;border-radius:999px;border:1px solid var(--line);flex-wrap:wrap;
}
.delivery-tab{
  padding:8px 18px;border:none;background:transparent;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink-light);cursor:pointer;
  transition:all 0.15s;
}
.delivery-tab:hover{color:var(--ink);}
.delivery-tab.active{background:var(--brand-red);color:#fff;}
.delivery-card{
  border:1.5px solid var(--line);border-radius:var(--radius-lg);
  padding:1.25rem;margin-bottom:1rem;background:var(--surface);
  transition:all 0.2s ease;
}
.delivery-card:hover{box-shadow:var(--shadow-md);}
.delivery-card-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:1rem;padding-bottom:1rem;border-bottom:1.5px solid var(--line);
  flex-wrap:wrap;gap:12px;
}
.delivery-info-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:12px;margin-bottom:1rem;
}
.delivery-info-item .lbl{
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--ink-light);font-weight:700;margin-bottom:3px;
}
.delivery-info-item .val{font-size:14px;font-weight:600;color:var(--ink);}
.delivery-info-item .val.mono{font-family:var(--font-mono);}
.courier-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-alt);border:1px solid var(--line);
}
.courier-badge.jnt{background:#E53935;color:#fff;border-color:#E53935;}
.courier-badge.poslaju{background:#1565C0;color:#fff;border-color:#1565C0;}
.courier-badge.gdex{background:#F57C00;color:#fff;border-color:#F57C00;}
.courier-badge.skynet{background:#6A1B9A;color:#fff;border-color:#6A1B9A;}
.courier-badge.dhl{background:#FFC107;color:#000;border-color:#FFC107;}
.courier-badge.lalamove{background:#512DA8;color:#fff;border-color:#512DA8;}
.courier-badge.pickup{background:#455A64;color:#fff;border-color:#455A64;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left" id="orbit-brand"></div>
    <div class="pill-nav" id="orbit-nav"></div>
    <div class="topbar-search" id="orbit-search"></div>
    <div class="topbar-right">
      <div class="user-chip" id="orbit-user-chip"></div>
    </div>
  </div>

  <main class="main">
    <div class="page-head">
      <div class="crumb" id="orbit-crumb"></div>
      <h1>Delivery Management</h1>
      <p class="page-desc">
        Assign courier services, enter tracking numbers, convert to Delivery Orders, and confirm deliveries.
      </p>
    </div>

    <!-- Toolbar -->
    <div class="delivery-toolbar">
      <div class="delivery-tabs">
        <button class="delivery-tab active" data-filter="pending" onclick="setDeliveryFilter('pending')">Awaiting Dispatch</button>
        <button class="delivery-tab" data-filter="dispatched" onclick="setDeliveryFilter('dispatched')">Dispatched</button>
        <button class="delivery-tab" data-filter="delivered" onclick="setDeliveryFilter('delivered')">Delivered</button>
        <button class="delivery-tab" data-filter="all" onclick="setDeliveryFilter('all')">All</button>
      </div>
      <div style="font-size:12px;color:var(--ink-light);">
        <span id="delivery-count" style="font-weight:700;color:var(--ink);">0</span> orders
      </div>
    </div>

    <!-- Delivery Orders List -->
    <div id="delivery-list"></div>

  </main>

  <!-- Modal Container -->
  <div id="delivery-modal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/app.js"></script>
<script>
const __uid = orbitRenderShell("delivery.html", "Delivery Management");

if(__uid !== null){

let currentFilter = "pending";


/* ===== Get courier badge class ===== */
function courierClass(courier){
  if(!courier) return "";
  const c = courier.toLowerCase();
  if(c.includes("j&t") || c.includes("jnt")) return "jnt";
  if(c.includes("pos")) return "poslaju";
  if(c.includes("gdex")) return "gdex";
  if(c.includes("skynet")) return "skynet";
  if(c.includes("dhl")) return "dhl";
  if(c.includes("lalamove")) return "lalamove";
  if(c.includes("pickup") || c.includes("self")) return "pickup";
  return "";
}

/* ===== Render Delivery List ===== */
function renderDeliveryList(){
  const jobs = orbitGetJobs().filter(j => {
    if(j.stage < 13) return false;
    const status = j.deliveryData?.status || "pending";
    if(currentFilter === "all") return true;
    return status === currentFilter;
  });

  document.getElementById("delivery-count").textContent = jobs.length;

  const listEl = document.getElementById("delivery-list");

  if(jobs.length === 0){
    listEl.innerHTML =
      '<div class="card accent-top prod-empty">' +
        '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>' +
          '<circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>' +
        '</svg>' +
        '<p style="font-weight:600;">No orders in this category</p>' +
      '</div>';
    return;
  }

  listEl.innerHTML = jobs.map(j => {
    const dd = j.deliveryData || {};
    const isUrgent = orbitIsUrgent(j.urgent);
    const urgencyClass = j.urgent === "super-urgent" ? " super-urgent" : (isUrgent ? " important" : "");
    const status = dd.status || "pending";

    return '<div class="delivery-card orbit-filterable' + urgencyClass + '"' +
      ' data-job="' + j.id + '" data-client="' + j.client + '" data-important="' + isUrgent + '">' +

      '<div class="delivery-card-header">' +
        '<div style="min-width:0;">' +
          '<div class="job-id">' + j.id + orbitUrgencyTag(j.urgent) + '</div>' +
          '<div class="job-client">' + j.client + ' &middot; ' + (j.product || "—") + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          (dd.courier ? '<span class="courier-badge ' + courierClass(dd.courier) + '">' + dd.courier + '</span>' : '') +
          '<span class="delivery-status ' + status + '">' + status.charAt(0).toUpperCase() + status.slice(1) + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="delivery-info-grid">' +
        '<div class="delivery-info-item"><div class="lbl">Quantity</div><div class="val mono">' + (j.quantity?.toLocaleString() || "—") + '</div></div>' +
        '<div class="delivery-info-item"><div class="lbl">Deadline</div><div class="val">' + (j.deadline || "—") + '</div></div>' +
        '<div class="delivery-info-item"><div class="lbl">Tracking No.</div>' +
          '<div class="val">' + (dd.trackingNo ? '<span class="tracking-display">' + dd.trackingNo + '</span>' : '<span style="color:var(--ink-light);font-weight:400;">Not assigned</span>') + '</div>' +
        '</div>' +
        '<div class="delivery-info-item"><div class="lbl">DO Number</div>' +
          '<div class="val mono">' + (dd.doNumber || "—") + '</div>' +
        '</div>' +
        (dd.dispatchedAt ? '<div class="delivery-info-item"><div class="lbl">Dispatched</div><div class="val mono" style="font-size:12px;">' + dd.dispatchedAt + '</div></div>' : '') +
        (dd.deliveredAt ? '<div class="delivery-info-item"><div class="lbl">Delivered</div><div class="val mono" style="font-size:12px;color:var(--success);">' + dd.deliveredAt + '</div></div>' : '') +
      '</div>' +

      (dd.address ? '<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px;">' +
        '<strong>Address:</strong> ' + dd.address +
        (dd.contact ? ' &middot; <strong>Contact:</strong> ' + dd.contact : '') +
      '</div>' : '') +

      '<div class="job-actions" style="margin-bottom:0;">' +
        (status === "pending" ?
          '<button class="btn btn-primary" onclick="openDispatchModal(\'' + j.id + '\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">' +
              '<path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/>' +
            '</svg>Assign Courier & Dispatch' +
          '</button>' : '') +
        (status === "dispatched" ?
          '<button class="btn btn-success" onclick="markDelivered(\'' + j.id + '\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
              '<polyline points="20 6 9 17 4 12"/>' +
            '</svg>Mark as Delivered' +
          '</button>' : '') +
        '<button class="btn" onclick="printDO(\'' + j.id + '\')">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
            '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>' +
          '</svg>Print Delivery Order' +
        '</button>' +
        (dd.trackingNo ?
          '<button class="btn" onclick="viewTracking(\'' + dd.trackingNo + '\',\'' + dd.courier + '\')">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' +
            '</svg>Track Shipment' +
          '</button>' : '') +
      '</div>' +

    '</div>';
  }).join("");

  orbitApplyFilters();
}

/* ===== Filter ===== */
function setDeliveryFilter(filter){
  currentFilter = filter;
  document.querySelectorAll(".delivery-tab").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === filter);
  });
  renderDeliveryList();
}

/* ===== Dispatch Modal ===== */
function openDispatchModal(jobId){
  const job = orbitGetJob(jobId);
  if(!job) return;
  const dd = job.deliveryData || {};
  const doNumber = dd.doNumber || orbitGenerateDONumber(jobId);

  const modal = document.getElementById("delivery-modal-container");
  modal.innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)this.innerHTML=\'\'">' +
      '<div class="modal" style="max-width:560px;">' +
        '<div class="modal-header">' +
          '<h2>Dispatch — ' + jobId + '</h2>' +
          '<button class="modal-close" onclick="this.closest(\'.modal-overlay\').parentElement.innerHTML=\'\'">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' +

          '<div class="summary-grid" style="margin-bottom:1.25rem;">' +
            '<div class="summary-item"><div class="lbl">Job ID</div><div class="val mono brand">' + jobId + '</div></div>' +
            '<div class="summary-item"><div class="lbl">Customer</div><div class="val">' + job.client + '</div></div>' +
            '<div class="summary-item"><div class="lbl">Product</div><div class="val">' + (job.product || "—") + '</div></div>' +
            '<div class="summary-item"><div class="lbl">Quantity</div><div class="val mono">' + (job.quantity?.toLocaleString() || "—") + '</div></div>' +
          '</div>' +

          '<div><label>Courier Service <span class="req">*</span></label>' +
            '<select id="dispatch-courier" required>' +
              '<option value="">Select courier...</option>' +
              ORBIT_COURIERS.map(c => '<option value="' + c + '"' + (dd.courier === c ? ' selected' : '') + '>' + c + '</option>').join("") +
            '</select>' +
          '</div>' +

          '<div class="formgrid-2">' +
            '<div><label>Tracking Number <span class="req">*</span></label>' +
              '<input type="text" id="dispatch-tracking" placeholder="e.g. Tracking number" value="' + (dd.trackingNo || "") + '" required>' +
            '</div>' +
            '<div><label>Delivery Order No.</label>' +
              '<input type="text" id="dispatch-do" value="' + doNumber + '" readonly style="background:var(--surface-alt);font-family:var(--font-mono);font-weight:600;">' +
            '</div>' +
          '</div>' +

          '<div><label>Delivery Address</label>' +
            '<textarea id="dispatch-address" rows="2" placeholder="Full delivery address...">' + (dd.address || "") + '</textarea>' +
          '</div>' +

          '<div class="formgrid-2">' +
            '<div><label>Contact Person</label>' +
              '<input type="text" id="dispatch-contact" placeholder="Name & phone number" value="' + (dd.contact || "") + '">' +
            '</div>' +
            '<div><label>Vehicle / Driver (optional)</label>' +
              '<input type="text" id="dispatch-vehicle" placeholder="e.g. Van WYX 1234 / Driver: Ali">' +
            '</div>' +
          '</div>' +

        '</div>' +
        '<div class="modal-footer">' +
          '<button class="btn" onclick="document.getElementById(\'delivery-modal-container\').innerHTML=\'\'">Cancel</button>' +
          '<button class="btn btn-primary btn-lg" onclick="submitDispatch(\'' + jobId + '\')">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">' +
              '<polyline points="20 6 9 17 4 12"/>' +
            '</svg>Confirm Dispatch' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* ===== Submit Dispatch ===== */
function submitDispatch(jobId){
  const courier = document.getElementById("dispatch-courier").value;
  const trackingNo = document.getElementById("dispatch-tracking").value.trim();
  const doNumber = document.getElementById("dispatch-do").value.trim();
  const address = document.getElementById("dispatch-address").value.trim();
  const contact = document.getElementById("dispatch-contact").value.trim();

  if(!courier){ orbitToast("Please select a courier", "warning"); return; }
  if(!trackingNo){ orbitToast("Please enter tracking number", "warning"); document.getElementById("dispatch-tracking").focus(); return; }

  const user = ORBIT_USERS[__uid];

  orbitUpdateJob(jobId, {
    status: "progress",
    deliveryData: {
      courier, trackingNo, doNumber, address, contact,
      status: "dispatched",
      dispatchedAt: orbitNow(),
      dispatchedBy: user?.name || "Delivery"
    }
  });

  orbitLogAction(jobId + ": dispatched via " + courier + " — " + trackingNo, "success");

  // Notify
  orbitNotifyDepartments(
    jobId, orbitGetJob(jobId)?.client || "", 13,
    jobId + " dispatched via " + courier + " — Tracking: " + trackingNo,
    ["dashboard.html", "sales.html"]
  );

  document.getElementById("delivery-modal-container").innerHTML = "";
  renderDeliveryList();
}

/* ===== Mark as Delivered ===== */
function markDelivered(jobId){
  if(!confirm("Confirm " + jobId + " has been delivered to the customer?")) return;

  const job = orbitGetJob(jobId);
  const dd = job.deliveryData || {};
  dd.status = "delivered";
  dd.deliveredAt = orbitNow();

  orbitUpdateJob(jobId, {
    status: "complete",
    statusLabel: "Delivered",
    deliveryData: dd
  });

  orbitLogAction(jobId + ": marked as DELIVERED", "success");

  orbitNotifyDepartments(
    jobId, job.client, 13,
    jobId + " DELIVERED to customer",
    ["dashboard.html", "sales.html"]
  );

  renderDeliveryList();
}

/* ===== Print Delivery Order ===== */
function printDO(jobId){
  const job = orbitGetJob(jobId);
  if(!job) return;
  const dd = job.deliveryData || {};
  const doNumber = dd.doNumber || orbitGenerateDONumber(jobId);

  const printWindow = window.open('', '_blank');
  if(!printWindow){ orbitToast("Please allow pop-ups to print", "warning"); return; }

  printWindow.document.write(`
    <!DOCTYPE html><html><head><title>Delivery Order — ${doNumber}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#000;font-size:12px;max-width:800px;margin:0 auto;}
      .do-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #C0272B;padding-bottom:16px;margin-bottom:20px;}
      .do-header h1{color:#C0272B;margin:0;font-size:24px;}
      .do-header .sub{color:#666;font-size:11px;font-style:italic;}
      .do-number{text-align:right;}
      .do-number .big{font-size:22px;font-weight:bold;color:#C0272B;font-family:Courier,monospace;}
      .do-number .small{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.05em;}
      .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
      .box{border:1px solid #999;padding:12px;border-radius:4px;}
      .box .lbl{font-size:10px;text-transform:uppercase;color:#666;font-weight:bold;margin-bottom:4px;}
      .box .val{font-weight:bold;font-size:13px;}
      table{width:100%;border-collapse:collapse;margin:16px 0;}
      th,td{border:1px solid #999;padding:10px;text-align:left;}
      th{background:#f0f0f0;font-weight:bold;}
      .qty{text-align:center;font-family:Courier,monospace;font-weight:bold;}
      .sign-area{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;margin-top:50px;}
      .sign-line{border-top:1px solid #000;padding-top:4px;text-align:center;font-size:11px;}
      .footer{margin-top:30px;padding-top:12px;border-top:1px solid #999;font-size:10px;color:#666;display:flex;justify-content:space-between;}
      .qr-box{text-align:center;margin:16px 0;padding:12px;border:2px dashed #999;border-radius:8px;}
      .qr-box img{width:100px;height:100px;}
      @media print{body{padding:0;}}
    </style><\/head><body>
    <div class="do-header">
      <div>
        <h1>SARMAN PRINTING</h1>
        <div class="sub">"Order Harini, Siap Semalam?" &middot; 1225205-P</div>
        <div style="font-size:11px;color:#666;margin-top:4px;">
          HQ: No. 8, Jalan PBS 14/9, Taman Perindustrian Bukit Serdang, Seri Kembangan<br>
          Tel: +6012-4771773 &middot; Email: marketing.sarmanprinting@gmail.com
        </div>
      </div>
      <div class="do-number">
        <div class="small">Delivery Order</div>
        <div class="big">${doNumber}</div>
        <div style="font-size:11px;color:#666;margin-top:4px;">Date: ${orbitNow()}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="box">
        <div class="lbl">Deliver To</div>
        <div class="val">${job.client}</div>
        <div style="margin-top:6px;font-size:12px;line-height:1.5;">${dd.address || "—"}</div>
        <div style="margin-top:6px;font-size:12px;"><strong>Contact:</strong> ${dd.contact || "—"}</div>
      </div>
      <div class="box">
        <div class="lbl">Job Reference</div>
        <div class="val" style="font-family:Courier,monospace;">${job.id}</div>
        <div style="margin-top:6px;font-size:12px;"><strong>Courier:</strong> ${dd.courier || "—"}</div>
        <div style="font-size:12px;"><strong>Tracking:</strong> <span style="font-family:Courier,monospace;font-weight:bold;">${dd.trackingNo || "—"}</span></div>
        <div style="font-size:12px;"><strong>Sales Person:</strong> ${job.salesPerson || "—"}</div>
      </div>
    </div>

    <table>
      <thead>
        <tr><th style="width:50px;">No.</th><th>Description</th><th style="width:100px;">Quantity</th><th style="width:100px;">Unit</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="qty">1</td>
          <td>
            <strong>${job.product || "Printing Services"}</strong><br>
            <span style="color:#666;font-size:11px;">${job.description || ""}</span>
            ${job.salesData?.paperType ? '<br><span style="color:#666;font-size:11px;">Material: ' + job.salesData.paperType + (job.salesData.gsm ? ' ' + job.salesData.gsm + 'gsm' : '') + '</span>' : ''}
          </td>
          <td class="qty">${job.quantity?.toLocaleString() || "—"}</td>
          <td class="qty">pcs</td>
        </tr>
      </tbody>
    </table>

    <div class="qr-box">
      <img src="${orbitGenerateQRUrl(jobId, 100)}" alt="QR ${jobId}"><br>
      <span style="font-family:Courier,monospace;font-weight:bold;">${job.id}</span><br>
      <span style="font-size:10px;color:#666;">Scan to verify delivery</span>
    </div>

    <div style="font-size:11px;color:#666;margin-top:16px;">
      <strong>Received in good condition by:</strong> __________________________ &nbsp;&nbsp;
      <strong>Date:</strong> _______________ &nbsp;&nbsp;
      <strong>Signature:</strong> __________________________
    </div>

    <div class="sign-area">
      <div><div class="sign-line">Prepared By</div></div>
      <div><div class="sign-line">Checked By</div></div>
      <div><div class="sign-line">Driver / Courier</div></div>
    </div>

    <div class="footer">
      <span>ORBIT Delivery Order v2.0</span>
      <span>${doNumber}</span>
      <span>This is a computer-generated document</span>
    </div>
    <\/body><\/html>
  `);
  printWindow.document.close();
  setTimeout(() => printWindow.print(), 500);
}

/* ===== Track Shipment ===== */
function viewTracking(trackingNo, courier){
  orbitToast("Tracking: " + trackingNo + " (" + courier + ")", "info");
  // In production, this would open the courier's tracking website
}

/* ===== Initialize ===== */
renderDeliveryList();

} // end auth check
</script>

</body>
</html>
