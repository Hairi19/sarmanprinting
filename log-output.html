<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Output · ORBIT</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.log-summary-card{
  background:linear-gradient(135deg, var(--surface-alt) 0%, var(--paper-warm) 100%);
  border-radius:var(--radius-lg);
  padding:1.25rem 1.5rem;
  border:1.5px solid var(--line);
  margin-bottom:1.25rem;
}
.log-summary-card h3{margin-bottom:0.75rem;color:var(--ink);}
.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.summary-item{
  background:var(--surface);
  border-radius:var(--radius);
  padding:10px 12px;
  border:1px solid var(--line);
}
.summary-item .lbl{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-light);
  font-weight:700;
  margin-bottom:4px;
}
.summary-item .val{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}
.summary-item .val.mono{font-family:var(--font-mono);}
.summary-item .val.brand{color:var(--brand-red);}
.quantity-hint{
  display:flex;
  gap:8px;
  margin-top:-8px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.qty-preset{
  padding:4px 10px;
  background:var(--surface-alt);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
  cursor:pointer;
  transition:all 0.15s ease;
  color:var(--ink-3);
  font-weight:600;
}
.qty-preset:hover{
  background:var(--brand-red-light);
  border-color:var(--brand-red-soft);
  color:var(--brand-red-dark);
}
.stage-flow-indicator{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:1.25rem;
  padding:12px 16px;
  background:var(--info-bg);
  border-radius:var(--radius);
  border:1px solid #BBDEFB;
  font-size:13.5px;
  color:var(--info);
  font-weight:600;
}
.stage-flow-indicator svg{flex-shrink:0;}
.stage-flow-indicator .arrow{color:var(--info);opacity:0.6;}
.stage-flow-indicator .from-stage{font-weight:700;}
.stage-flow-indicator .to-stage{font-weight:700;color:var(--brand-red-dark);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left" id="orbit-brand"></div>
    <div class="pill-nav" id="orbit-nav"></div>
    <div class="topbar-search" id="orbit-search"></div>
    <div class="topbar-right">
      <div class="user-chip" id="orbit-user-chip"></div>
    </div>
  </div>

  <main class="main">
    <div class="page-head">
      <div class="crumb" id="orbit-crumb"></div>
      <h1>Log Production Output</h1>
      <p class="page-desc">Record the quantity produced at this stage. This entry is timestamped and attributed for audit purposes.</p>
    </div>

    <!-- Urgency Banner -->
    <div id="lo-banner"></div>

    <!-- Stage Flow Indicator -->
    <div class="stage-flow-indicator">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      <span>From: <span class="from-stage" id="flow-from">—</span></span>
      <span class="arrow">&rarr;</span>
      <span>To: <span class="to-stage" id="flow-to">—</span></span>
    </div>

    <!-- Job Summary -->
    <div class="log-summary-card">
      <h3>Job Information</h3>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="lbl">Job ID</div>
          <div class="val mono brand" id="lo-job-display">—</div>
        </div>
        <div class="summary-item">
          <div class="lbl">Current Stage</div>
          <div class="val" id="lo-stage-display">—</div>
        </div>
        <div class="summary-item">
          <div class="lbl">Logged By</div>
          <div class="val" id="lo-user-display">—</div>
        </div>
        <div class="summary-item">
          <div class="lbl">Date &amp; Time</div>
          <div class="val mono" id="lo-time-display">—</div>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="card accent-top" style="max-width:680px;">
      <h2 class="section-heading">Production Output Log</h2>

      <div>
        <label>Job ID</label>
        <input type="text" id="lo-job" readonly style="background:var(--surface-alt);font-family:var(--font-mono);font-weight:700;color:var(--brand-red);">
      </div>

      <div>
        <label>Output Quantity (units) <span class="req">*</span></label>
        <input type="number" id="lo-qty" placeholder="Enter number of good units produced" min="1" required>
        <div class="quantity-hint">
          <span class="qty-preset" onclick="setQty(500)">+500</span>
          <span class="qty-preset" onclick="setQty(1000)">+1,000</span>
          <span class="qty-preset" onclick="setQty(1500)">+1,500</span>
          <span class="qty-preset" onclick="setQty(2000)">+2,000</span>
          <span class="qty-preset" onclick="setQty(3000)">+3,000</span>
          <span class="qty-preset" onclick="setQty(5000)">+5,000</span>
        </div>
      </div>

      <div class="formgrid-2">
        <div>
          <label>Rejected / Waste Units</label>
          <input type="number" id="lo-rejected" placeholder="Units rejected or wasted" min="0" value="0">
        </div>
        <div>
          <label>Yield</label>
          <input type="text" id="lo-yield" readonly placeholder="Auto-calculated" style="background:var(--surface-alt);font-weight:600;color:var(--success);font-family:var(--font-mono);">
        </div>
      </div>

      <div>
        <label>Machine / Operator</label>
        <input type="text" id="lo-machine" placeholder="e.g. Heidelberg SM-74 / Operator: Ahmad">
      </div>

      <div>
        <label>Material Used</label>
        <input type="text" id="lo-material" placeholder="e.g. 300gsm Art Card, Matte lamination film">
      </div>

      <div>
        <label>Notes (optional)</label>
        <textarea id="lo-notes" rows="3" placeholder="Any issues encountered, material variations, machine adjustments, quality observations..."></textarea>
      </div>

      <div class="job-actions" style="border-top:2px solid var(--line);padding-top:1.25rem;justify-content:flex-end;">
        <button class="btn" onclick="location.href='production.html'+location.search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Cancel
        </button>
        <button class="btn btn-primary btn-lg" onclick="submitLogOutput()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/>
          </svg>
          Submit &amp; Forward to Next Process
        </button>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/app.js"></script>
<script>
const __uid = orbitRenderShell("production.html", "Production Floor");

if(__uid !== null){

/* Stage metadata */
const LOG_STAGE_META = {
  3: {name:"Cutter", next:"Printing"},
  4: {name:"Printing", next:"Lamination"},
  5: {name:"Lamination", next:"Spot UV"},
  6: {name:"Spot UV", next:"Stamping"},
  7: {name:"Stamping", next:"Emboss"},
  8: {name:"Emboss", next:"Deboss"},
  9: {name:"Deboss", next:"Die Cut"},
  10:{name:"Die Cut", next:"Glue"},
  11:{name:"Glue", next:"Final QC"}
};

/* Get URL parameters */
const params = new URLSearchParams(location.search);
const stageIdx = parseInt(params.get("stage"), 10);
const jobId = params.get("job") || "";
const urgent = params.get("urgent") || "normal";
const meta = Object.assign({}, LOG_STAGE_META[stageIdx] || {name:"Production", next:"the next process"});
/* Next process depends on this order's own route (skips stages it doesn't need) */
const __jobForRoute = jobId ? orbitGetJob(jobId) : null;
if(__jobForRoute && LOG_STAGE_META[stageIdx]){
  const __n = orbitNextStageIdx(Object.assign({}, __jobForRoute, {stage: stageIdx}));
  meta.next = ORBIT_STAGES[__n].name;
}
const user = ORBIT_USERS[__uid];

/* Populate display fields */
document.getElementById("lo-title")?.textContent; // legacy
document.getElementById("lo-job").value = jobId;
document.getElementById("lo-job-display").textContent = jobId || "—";
document.getElementById("lo-stage-display").textContent = meta.name;
document.getElementById("lo-user-display").textContent = user ? user.name : "—";
document.getElementById("lo-time-display").textContent = orbitNow();
document.getElementById("flow-from").textContent = meta.name;
document.getElementById("flow-to").textContent = meta.next;

/* Urgency banner */
if(urgent === "super-urgent"){
  document.getElementById("lo-banner").innerHTML = orbitImportantBanner(jobId + " is SUPER URGENT — double-check quantity and finishing quality before logging.", "super-urgent");
} else if(urgent === "urgent"){
  document.getElementById("lo-banner").innerHTML = orbitImportantBanner(jobId + " is marked Urgent — confirm quantity and specs before forwarding.");
}

/* Quantity preset helper */
function setQty(n){
  document.getElementById("lo-qty").value = n;
  updateYield();
}

/* Auto-calculate yield */
function updateYield(){
  const qty = parseFloat(document.getElementById("lo-qty").value) || 0;
  const rejected = parseFloat(document.getElementById("lo-rejected").value) || 0;
  const total = qty + rejected;
  const yieldEl = document.getElementById("lo-yield");

  if(total > 0){
    const pct = ((qty / total) * 100).toFixed(1);
    yieldEl.value = pct + "% (" + qty.toLocaleString() + " good / " + total.toLocaleString() + " total)";
  } else {
    yieldEl.value = "";
  }
}

document.getElementById("lo-qty").addEventListener("input", updateYield);
document.getElementById("lo-rejected").addEventListener("input", updateYield);

/* Allow Enter to submit from quantity field */
document.getElementById("lo-qty").addEventListener("keydown", e => {
  if(e.key === "Enter") submitLogOutput();
});

/* Submit */
function submitLogOutput(){
  const qty = document.getElementById("lo-qty").value;
  if(!qty || parseInt(qty) <= 0){
    orbitToast("Please enter a valid output quantity", "warning");
    document.getElementById("lo-qty").focus();
    return;
  }

  const rejected = document.getElementById("lo-rejected").value || 0;
  const machine = document.getElementById("lo-machine").value.trim();
  const material = document.getElementById("lo-material").value.trim();
  const notes = document.getElementById("lo-notes").value.trim();

  let msg = jobId + ": " + parseInt(qty).toLocaleString() + " units logged at " + meta.name;
  if(parseInt(rejected) > 0) msg += " (" + rejected + " rejected)";
  msg += " and sent to " + meta.next;
  if(machine) msg += " &middot; Machine: " + machine;

  orbitLogAction(msg, "success");

  setTimeout(() => {
    location.href = "production.html" + location.search;
  }, 700);
}

} // end auth check
</script>

</body>
</html>
